{% extends 'web/base.html' %}
{% block title %}Регистрация — Авто-помощник{% endblock %}
{% block content %}
<div style="padding:60px 5vw;display:flex;align-items:center;justify-content:center;min-height:calc(100vh - var(--nav-h))">
<div class="form-card" style="width:100%">
  <h2 style="font-family:'Unbounded',sans-serif;font-size:20px;font-weight:800;margin-bottom:6px">Регистрация</h2>
  <p style="font-size:13px;color:var(--gray);margin-bottom:24px">Создайте аккаунт</p>
  <form method="post">
    {% csrf_token %}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="fg"><label>Имя</label><input type="text" name="first_name" placeholder="Иван" required></div>
      <div class="fg"><label>Фамилия</label><input type="text" name="last_name" placeholder="Иванов"></div>
    </div>
    <div class="fg"><label>Email</label><input type="email" name="email" placeholder="ivan@mail.ru"></div>
    <div class="fg"><label>Телефон</label><input type="tel" name="phone" placeholder="+7 900 000 0000"></div>
    <div class="fg"><label>Пароль</label><input type="password" name="password" placeholder="Минимум 6 символов" required></div>
    <div class="fg"><label>Повторите пароль</label><input type="password" name="password2" placeholder="••••••••" required></div>
    <button type="submit" class="btn btn-dark">Создать аккаунт</button>
  </form>
  <div style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--beige-mid);font-size:13px;color:var(--gray)">
    Уже есть аккаунт? <a href="{% url 'web:login' %}" style="color:var(--dark);font-weight:700">Войти</a>
  </div>
</div>
</div>
{% endblock %}
