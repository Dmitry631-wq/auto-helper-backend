{% extends 'web/base.html' %}
{% block title %}FAQ — Авто-помощник Абакан{% endblock %}
{% block content %}
<div class="page-header"><h1>Частые вопросы</h1><p>Ответы на популярные вопросы о приложении</p></div>
<div style="padding:28px 5vw 40px;max-width:760px">
  {% for f in faqs %}
  <div style="background:var(--card);border:1px solid var(--beige-mid);border-radius:15px;overflow:hidden;margin-bottom:10px;transition:.2s" class="faq-item">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:15px 18px;cursor:pointer;font-weight:700;font-size:14px;gap:11px" onclick="toggleFaq(this)">
      {{ f.q }}<span style="font-size:15px;transition:.3s;flex-shrink:0">▼</span>
    </div>
    <div style="max-height:0;overflow:hidden;transition:max-height .35s ease,padding .3s;padding:0 18px;color:var(--gray);font-size:13px;line-height:1.7">{{ f.a }}</div>
  </div>
  {% endfor %}
</div>
{% endblock %}
{% block extra_js %}
<script>
function toggleFaq(el){
  const body=el.nextElementSibling,arrow=el.querySelector('span');
  const open=body.style.maxHeight&&body.style.maxHeight!=='0px';
  document.querySelectorAll('.faq-item div:last-child').forEach(b=>{b.style.maxHeight='0';b.style.padding='0 18px';});
  document.querySelectorAll('.faq-item div span').forEach(a=>a.style.transform='');
  if(!open){body.style.maxHeight='200px';body.style.padding='0 18px 15px';arrow.style.transform='rotate(180deg)';}
}
</script>
{% endblock %}
